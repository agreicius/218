<article class="definition definition-like"><h2 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.8.2</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Exponential Functions.</span>
</h2>
<div class="para logical">
<div class="para">An <dfn class="terminology">exponential function</dfn> is a function <span class="process-math">\(f\colon \R\rightarrow \R\)</span> that can be written in the form</div>
<div class="displaymath process-math">
\begin{equation*}
f(x) = Ab^x
\end{equation*}
</div>
<div class="para">for some real numbers <span class="process-math">\(A\)</span> and <span class="process-math">\(b\)</span> such that <span class="process-math">\(A\neq 0, b&gt; 0\text{,}\)</span> and <span class="process-math">\(b\neq 1\text{.}\)</span>
</div>
